[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adf"
version = "1.5.2"
requires-python = ">=3.10, <3.12"
dependencies = [
    "numpy==1.26.4",
    "drain3==0.9.11",
    "polars-lts-cpu==1.33.1",
    "pyarrow==18.0.0",
    "typing-extensions==4.14.1",
]

[project.optional-dependencies]
core = [
    "hydra-core==1.3.2",
    "deepmerge==2.0",
    "tqdm==4.66.5",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "fastexcel==0.16.0",
    "shortuuid==1.0.13",
    "virtualenv==21.2.4",
    "python-dotenv==1.0.1",
    "typer==0.24.2",
    "uv==0.11.7",
    "h5py==3.14.0",
    "psutil==6.1.0",
    "requests==2.32.4",
    # Metrics training extras (adf[deploy] pulls adf[core])
    "torch-ema==0.3",
    "tensorboard==2.18.0",
    "optuna>=4.7.0",
]
deploy = [
    "adf[core]",
    "datasets==3.0.1",
    "torch==2.5.1",
    "scipy==1.16.0",
    "lightning==2.5.5",
    "pytorch-lightning==2.5.5",
    "sentence-transformers==3.2.0",
    "accelerate==1.0.1",
    "transformers==4.45.2",
    "torchmetrics==1.6.0",
    "scikit-learn==1.7.0",
    "matplotlib==3.9.2",
]
all = [
    "adf[core]",
    "adf[deploy]",
    "adf[dev]",
    "hnswlib>=0.8.0",
    "networkx==3.5",
]
dev = [
    "lightning==2.5.5",
    "pytorch-lightning==2.5.5",
    "torch-ema==0.3",
    "datasets==3.0.1",
    "tensorboard==2.18.0",
    "matplotlib==3.9.2",
    "tensordict==0.6.2; (sys_platform == 'linux' or sys_platform == 'darwin')",
    "shap==0.49.1",
    "optuna>=4.7.0",
    "ruff==0.9.6",
    "notebook==7.3.2",
    "mypy==1.15.0",
    "moto[all]==5.0.18",
    "pytest==8.3.5",
    "flake8==7.1.1",
    "pytest-cov==6.0.0",
    "flake8-pytest-style==2.0.0",
    "flake8-pyproject==1.2.3",
    "ipykernel==6.29.5",
    "faker==30.8.1",
]
tuning = [
    "optuna>=4.7.0",
]

[project.scripts]
adf = "adf.cli:main"

[tool.uv]
environments = ["python_full_version >= '3.11'"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"package" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
fix = true
line-length = 120
target-version = "py311"

[tool.ruff.lint.isort]
section-order = ["future", "third-party", "first-party", "local-folder"]
from-first = false
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
]

ignore = [
    "B008",
    "B019",
    "D100",
    "D104",
    "D101",
    "D401",
    "D203",
    "D213",
    "ANN401",
    "N803",
    "N806",
    "N802",
    "N812",
    "UP038",
    "UP035",
    "UP007",
    "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/tests_logs_od/test_vae.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "D102", "D103"]

unfixable = [
    "F401",
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
no_implicit_optional = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
disable_error_code = ["attr-defined", "import-untyped", "var-annotated", "no-untyped-call", "misc", "index"]
enable_error_code = "explicit-override"

