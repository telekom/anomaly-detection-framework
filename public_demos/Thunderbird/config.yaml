# ADF public demo — Thunderbird — the first 20 M lines of tbird2, chronological split
# Every value below is the one that produced the published result; the notebook reads this file.

dataset:
  name: Thunderbird
  source_page: https://www.usenix.org/cfdr-data
  url: http://0b4af6cdc2f0c5998459-c0245c5c937c5dedcca3f1764ecc9b2f.r43.cf2.rackcdn.com/hpc4/tbird2.gz
  file: tbird2.gz
  size_bytes: 2026877828
  md5: 0921133169751ae2af9d0bb2c63a13d7
  sha256: 5a8137a98216f40284626ac2f5ff69e069d4bde32770232aefcb275879571484
  subset:
    file: tbird2_20M
    lines: 20000000              # the first 20,000,000 lines of the decompressed tbird2
    sha256: 13a28cf72ba52c8a579cd8479c6b2618c11799e6fc2cf58432df76d3a1f2bcd2

base_model:
  hf_id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41

split:
  method: chronological
  train_ratio: 0.8              # everything before this point is train + validation
  train_share_of_fit: 0.75       # of that, the first share trains and the rest validates

windows:
  size: 5
  step: 1
  per_node: true                  # windows never mix lines of different nodes
  pad_line: -1                    # short nodes are padded; padding is masked

drain:
  sim_th: 0.85
  depth: 3
  max_children: 100
  parametrize_numeric_tokens: true
  use_polars_masking: true
  trim_max_length: null
  fit_splits: [train, val]        # normal lines only
  online_fit:
    splits: [val, test]
    sim_th: 0.9

simcse:
  min_contrastive_gap: 0.8
  max_rounds: 10
  epochs_per_round: 2
  learning_rate: 2.0e-05
  warmup_ratio: 0.1
  batch_size: 16

autoencoder:
  model_name: LSTMAutoEncoder
  model_args:
    input_dim: 384
    hidden_dim: 32
    num_layers: 2
    sigma: 0.7382806456682623
    dropout: 0.0
    enc_dropout: 0.026813575389864702
    dec_dropout: 0.04723674385963759
  loss: MSELoss
  optimizer: AdamW
  optimizer_config:
    lr: 0.004467752817973905
    weight_decay: 1.7654048052495048e-07
    betas: [0.8300170052944527, 0.9541243176549847]
  scheduler: OneCycleLR
  scheduler_config:            # total_steps is computed from the number of training windows
    max_lr: 0.004467752817973905
    div_factor: 19.0
    final_div_factor: 100.0
    pct_start: 0.06582955111868832
    three_phase: false

training:
  max_epochs: 25
  batch_size: 128
  seed: 42
  val_fraction_for_checkpoint: 0.5   # the first half of the validation windows selects the epoch
  checkpoint_monitor: val_loss   # best epoch by validation loss

evaluation:
  unit: line
  verdict_rule: own_timestep      # a line takes its own step error in the window that ends on it
  threshold: 0.0027536307461559772
  threshold_note: >-
    Chosen by threshold_selector (section 7.3) on the 16,000,000 lines of the training and
    validation periods, 480,210 of them anomalous, with a copy of the parser that has
    seen no test line. No test line is involved. For reproducibility:
    the nearest test line score lies 7.9e-09 away on MPS and 1.1e-08 on the CPU, and the
    verdicts are the same on both.
  test_lines: 4000000
  test_anomalous: 283846
  expected:
    tp: 281121
    fp: 1613
    fn: 2725
    precision: 0.99429
    recall: 0.99040
    f1: 0.99234

artifacts:
  autoencoder:
    file: artifacts/autoencoder.ckpt
    sha256: d4b73d046a8ad9ff7346fd4cd9c4a14bfaa09e482da78021f346b67792d5799c
  template_embeddings:
    file: artifacts/template_embeddings.npy
    sha256: 0eaa0f6d08251751df69ac194ecd23f592a3c0e8cb601615103c3639a36be128
  templates:
    file: artifacts/templates.json
    sha256: 64dd05e1b8dba6b4aa498e8b62ae1c4ca758efbbdcae8fcc88fe7d1c16b4f2de
  drain_state:
    file: artifacts/drain/state.bin
    sha256: 85b81eed6b97cf6bea5c8e576ccec0c3b88778eb3eff56cc00affaf8d73704fd
  drain_config:
    file: artifacts/drain/config.ini
    sha256: 4ea72f28742a3b53d00af0d111067514b936e6b2f2f5b6402a96b630f37686a3
  threshold_templates:
    file: artifacts/threshold_templates.json
    sha256: e4a3ac0037b918c0a8fed8649821f028a3803ac5d157319c90a1fb5222fe3d06
  threshold_embeddings:
    file: artifacts/threshold_embeddings.npy
    sha256: f152ccd04b0b681360ce00e3e4e5bbbe3d28d118aee52ddd77ea3ac68ec0ef95
