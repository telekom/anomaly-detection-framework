[PROFILING]
enabled = False
report_sec = 30

[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[DRAIN]
sim_th = 0.85
depth = 3
max_children = 100
parametrize_numeric_tokens = True

[MASKING]
masking = [
	{
	"regex_pattern": "^(kernel:) (?:<[0-9a-f]+>)?\\{[^}]*\\+\\d+\\}.*$",
	"mask_with": "${1} <TRACE>"
	},
	{
	"regex_pattern": "(page allocation failure).*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(kernel:) Active:\\d+ inactive:.*$",
	"mask_with": "${1} <MEMSTAT>"
	},
	{
	"regex_pattern": "^(kernel:) [A-Za-z_]+\\(\\d+\\):.*$",
	"mask_with": "${1} <MODULE> <MASK>"
	},
	{
	"regex_pattern": "^(kernel:) [a-z_]+: .*$",
	"mask_with": "${1} <SUBSYS> <MASK>"
	},
	{
	"regex_pattern": "/[^\\s]+",
	"mask_with": "<PATH>"
	},
	{
	"regex_pattern": "0x[0-9a-fA-F]+",
	"mask_with": "<ADDRESS>"
	},
	{
	"regex_pattern": "\\b\\d+\\.\\d+\\.\\d+\\.\\d+\\b",
	"mask_with": "<IP>"
	},
	{
	"regex_pattern": "\\b(?:[0-9A-Fa-f]{2}:){5,}[0-9A-Fa-f]{2}\\b",
	"mask_with": "<MAC>"
	},
	{
	"regex_pattern": "\\b[0-9a-fA-F]{6,}\\b",
	"mask_with": "<HEX>"
	},
	{
	"regex_pattern": "\\[\\d+\\]",
	"mask_with": "[<NUM>]"
	},
	{
	"regex_pattern": "\\*\\d+",
	"mask_with": "<NUM>"
	},
	{
	"regex_pattern": "\\b\\d+\\b",
	"mask_with": "<NUM>"
	},
	{
	"regex_pattern": "\\[[A-Z]{2,}\\w*\\]",
	"mask_with": "[<ID>]"
	},
	{
	"regex_pattern": "\\b[a-zA-Z]+[0-9][a-zA-Z0-9]*\\b",
	"mask_with": "<ALNUM>"
	},
	{
	"regex_pattern": "\\b[0-9]+[a-zA-Z][a-zA-Z0-9]*\\b",
	"mask_with": "<ALNUM>"
	},
	{
	"regex_pattern": "(<NUM> ){3,}<NUM>",
	"mask_with": "<NUMS> "
	}
	]
mask_prefix = 
mask_suffix = 

