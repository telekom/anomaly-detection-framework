[PROFILING]
enabled = False
report_sec = 30

[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[DRAIN]
sim_th = 0.82
depth = 7
max_children = 200
parametrize_numeric_tokens = True

[MASKING]
masking = [
	{
	"regex_pattern": "/?(?:\\d{1,3}\\.){3}\\d{1,3}(?::\\d{2,5})?",
	"mask_with": "<IP>"
	},
	{
	"regex_pattern": "blk_(|-)[0-9]+",
	"mask_with": "<blk_>"
	}
	]
mask_prefix = <
mask_suffix = >

