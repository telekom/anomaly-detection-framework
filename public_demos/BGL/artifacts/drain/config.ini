[PROFILING]
enabled = False
report_sec = 30

[SNAPSHOT]
snapshot_interval_minutes = 10
compress_state = True

[DRAIN]
sim_th = 0.3
depth = 3
max_children = 100
parametrize_numeric_tokens = True

[MASKING]
masking = [
	{
	"regex_pattern": "(ddr: activating redundant bit steering).*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(core files for program)\\s+.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(critical input interrupt).*warning for .* wire.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(link training failed:)\\s*wanted:.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(bad message header:)\\s*.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(\\S+) .*Registers?:.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(\\S+) [a-z]\\w*=.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(\\S+) .*\\.{3,}.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(status=M)\\s+.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(FAILURE) Link .*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(\\S+) While (?:reading FanModule|setting fan speed) caught.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "^(\\S+) Hardware monitor caught java\\.net\\.SocketException.*$",
	"mask_with": "${1} <MASK>"
	},
	{
	"regex_pattern": "(INFO) .*ddr error\\(s\\) detected and corrected.*$",
	"mask_with": "${1} <MASK> ddr error(s) detected and corrected <MASK>"
	},
	{
	"regex_pattern": "^ERROR\\b.*$",
	"mask_with": "ERROR <MASK>"
	},
	{
	"regex_pattern": "^INFO\\s*$",
	"mask_with": "INFO <MASK>"
	},
	{
	"regex_pattern": "ddr:\\s+Suppressing.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\d+\\s+microseconds spent in the rbs signal.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\d+\\s+total interrupts.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "CE\\s+sym\\b.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\(dcr\\s+.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "Kernel detected.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "MACHINE CHECK DCR\\s+.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "ciod:\\s+Received signal.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "L1 DCACHE summary averages.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "ciod: generated .*core files for program.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "data cache .*parity error detected.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "Controlling BG.*rows.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\S+ has been started:.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "Node card VPD check: missing.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "EndServiceAction.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "ciod: Error loading .*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "(Temperature Over Limit|PGOOD error latched|Power Deactivated).*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "number of corrected SRAM errors has exceeded.*$",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\b\\d{1,2}:[0-9a-fA-F]{8}\\b",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\b0x[0-9a-fA-F]{1,16}\\b",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\b[0-9a-fA-F]{8,}\\b",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "\\b\\d+\\b",
	"mask_with": "<MASK>"
	},
	{
	"regex_pattern": "/[^\\s]+",
	"mask_with": "<PATH>"
	}
	]
mask_prefix = 
mask_suffix = 

